#!/usr/sbin/nft -f
# Router P02: filtrowanie ruchu miedzy CLIENT-NET, DMZ i DB-NET (network/traffic-matrix.md)
# eth0 = CLIENT-NET (192.168.10.1), eth1 = DMZ (192.168.20.1), eth2 = DB-NET (192.168.30.1)
flush ruleset

table inet router {
    chain input {
        type filter hook input priority filter; policy accept;
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # CLIENT -> DB-SRV: wszystko zablokowane
        ip saddr 192.168.10.10 ip daddr 192.168.30.10 counter log prefix "FW-DROP-CLIENT-DB: " drop

        # CLIENT -> APP-SRV: SSH i HTTP zablokowane, HTTPS dozwolony
        ip saddr 192.168.10.10 ip daddr 192.168.20.10 tcp dport { 22, 80 } counter log prefix "FW-DROP-CLIENT-APP: " drop
        ip saddr 192.168.10.10 ip daddr 192.168.20.10 tcp dport 443 ct state new counter accept

        # APP-SRV -> DB-SRV: tylko PostgreSQL
        ip saddr 192.168.20.10 ip daddr 192.168.30.10 tcp dport 5432 ct state new counter accept

        # diagnostyka (ping)
        ip protocol icmp counter accept

        # domyslnie: odrzuc
        counter drop
    }
}
