flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Ruch nawiazany i powiazany
        ct state established,related accept

        # Pakiety nieprawidlowe
        ct state invalid drop

        # Ruch loopback
        iif "lo" ip saddr 127.0.0.0/8 accept
        iif "lo" ip6 saddr ::1 accept

        # Diagnostyka ICMP
        ip protocol icmp accept

        # Dostęp administracyjny SSH
        tcp dport 22 ct state new accept

        # Dostep do PostgreSQL wylacznie dla APP-SRV
        ip saddr 192.168.20.10 tcp dport 5432 ct state new accept

        # Logowanie i odrzucenie pozostalego ruchu
        log prefix "[NFT-DROP] " limit rate 10/minute counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
