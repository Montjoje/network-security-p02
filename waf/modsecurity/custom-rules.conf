# Wlasne reguly WAF dla projektu P02

# 1. Blokowanie SQL Injection w POST (HTTP 403 + log)
SecRule REQUEST_METHOD "@streq POST" \
    "id:100001,phase:2,chain,deny,status:403,log,auditlog,msg:'SQL Injection detected in POST request',tag:'custom-sqli',severity:'CRITICAL'"
    SecRule ARGS_POST|REQUEST_BODY "@rx (?i)(?:'\s*or\s+\d+\s*[><=]\s*\d+\s*--|\bunion\s+select\b|'\s*or\s+'1'\s*=\s*'1)" \
        "t:none,t:urlDecodeUni,ctl:auditEngine=On"

# 2. Blokowanie Path Traversal w GET (HTTP 403 + log)
SecRule REQUEST_METHOD "@streq GET" \
    "id:100002,phase:2,chain,deny,status:403,log,auditlog,msg:'Path Traversal detected in GET request',tag:'custom-path-traversal',severity:'CRITICAL'"
    SecRule ARGS_GET|REQUEST_URI "@rx (?i)(?:\.\.[\\/]|/etc/passwd)" \
        "t:none,t:urlDecodeUni,ctl:auditEngine=On"

# 3. Wykrywanie i wylacznie logowanie Command Injection w GET (bez blokowania 403)
SecRule REQUEST_METHOD "@streq GET" \
    "id:100003,phase:2,chain,pass,log,auditlog,msg:'Command Injection detected in GET request',tag:'custom-cmdi',severity:'WARNING'"
    SecRule ARGS_GET "@rx (?i)(?:\bls\s+-[a-z]+|\bwhoami\b|\buname\s+-[a-z]+|\bcat\s+/|[;|`])" \
        "t:none,t:urlDecodeUni,ctl:auditEngine=On,ctl:ruleEngine=DetectionOnly"
